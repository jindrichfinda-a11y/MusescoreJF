<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuseScore Touch v2</title>
<style>
body{margin:0;background:#eef2f6;color:#182536;font:15px system-ui}header{background:#10243d;color:white;padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:9px;border:1px solid #ccd5df;border-radius:7px;background:white}button.active,.primary{background:#1976d2;color:white}.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#f9fbfd;align-items:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;padding:10px}.panel{background:white;border:1px solid #d8e0e9;border-radius:9px;padding:12px}.score{overflow:auto}svg{display:block;width:100%;min-width:680px;background:white}.keys{position:sticky;bottom:0;background:#e8edf3;padding:8px}.keyboard{display:flex;overflow:auto;height:110px}.white{height:108px;min-width:40px;background:white;border:1px solid #9aa6b4;display:flex;align-items:end;justify-content:center;padding-bottom:5px;position:relative}.black{position:absolute;right:-12px;top:0;width:23px;height:65px;background:#111;z-index:2;border-radius:0 0 4px 4px}
@media(max-width:700px){.layout{display:block}.side{margin-top:10px}}
</style></head><body>
<header><b>♫ MuseScore Touch</b><button onclick="newScore()">Nová</button><button onclick="saveScore()">Uložit</button><button onclick="exportJSON()">Export</button><button onclick="document.getElementById('file').click()">Otevřít</button><input id="file" type="file" accept=".json" hidden onchange="importJSON(event)"></header>
<div class="bar">
<button id="noteTool" class="active" onclick="tool='note';paintTools()">Nota</button>
<button onclick="setDuration(4)">Celá</button><button onclick="setDuration(2)">Půlová</button><button onclick="setDuration(1)">Čtvrťová</button><button onclick="setDuration(.5)">Osminová</button><button onclick="setDuration(.25)">Šestnáctinová</button>
<button id="restTool" onclick="tool='rest';paintTools()">Pomlka</button><button id="eraseTool" onclick="tool='erase';paintTools()">Guma</button>
<label>Takt <select id="meter" onchange="draw()"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option></select></label>
<label>Tempo <input id="tempo" type="number" value="100" min="30" max="240" style="width:65px"></label>
</div>
<div class="layout"><section class="panel"><h2 id="title">Moje skladba</h2><div class="score"><svg id="score" viewBox="0 0 900 470"></svg></div><p>Vyber délku noty nebo pomlku a klepni do osnovy. Po zaplnění taktu se zápis automaticky přesune do dalšího taktu.</p></section>
<aside class="side"><section class="panel"><h3>YouTube – doprovod</h3><input id="yt" placeholder="Odkaz na YouTube" style="width:90%"><button onclick="loadYT()">Načíst</button><iframe id="frame" style="width:100%;aspect-ratio:16/9;border:0;margin-top:8px" allowfullscreen></iframe></section><section class="panel"><h3>Přehrávání</h3><button class="primary" onclick="playAll()">▶ Přehrát</button><button onclick="stop()">Stop</button><p>Transpozice <select id="transpose"><option value="0">0</option><option value="2">+2</option><option value="-2">−2</option><option value="5">+5</option><option value="-5">−5</option></select></p></section></aside></div>
<div class="keys"><b>Virtuální klaviatura</b> <button onclick="octave=Math.max(1,octave-1);buildKeys()">−</button><span id="oct">4</span><button onclick="octave=Math.min(7,octave+1);buildKeys()">+</button><div id="keyboard" class="keyboard"></div></div>
<script>
const NS='http://www.w3.org/2000/svg';let notes=[],duration=1,tool='note',octave=4,ctx=null,timer=null;
const capacity=()=>document.getElementById('meter').value==='6/8'?3:+document.getElementById('meter').value[0];
function paintTools(){document.getElementById('noteTool').classList.toggle('active',tool==='note');document.getElementById('restTool').classList.toggle('active',tool==='rest');document.getElementById('eraseTool').classList.toggle('active',tool==='erase')}
function setDuration(d){duration=d;tool='note';paintTools()}
function el(tag,a,p){let e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));p.appendChild(e);return e}
function add(midi,x,sys){let measure=sys*4+Math.max(0,Math.min(3,Math.floor((x-55)/190))),cap=capacity();while(measure<64&&notes.filter(n=>n.measure===measure).reduce((s,n)=>s+n.duration,0)+duration>cap+1e-6)measure++;if(measure>=64){alert('Limit prototypu je 64 taktů.');return}let used=notes.filter(n=>n.measure===measure).reduce((s,n)=>s+n.duration,0),bar=measure%4,system=Math.floor(measure/4),pos=55+bar*190+12+used*160/cap;notes.push({midi,x:Math.min(55+bar*190+178,pos),measure,system,duration,rest:tool==='rest'});draw()}
function draw(){let s=document.getElementById('score');s.innerHTML='';let systems=Math.max(2,Math.floor(Math.max(7,...notes.map(n=>n.measure||0))/4)+1);s.setAttribute('viewBox',`0 0 900 ${systems*205+50}`);s.style.height=(systems*205+50)+'px';for(let z=0;z<systems;z++){let y=65+z*205;for(let i=0;i<5;i++)el('line',{x1:55,y1:y+i*10,x2:850,y2:y+i*10,stroke:'#222'},s);el('text',{x:10,y:y+28,'font-size':34},s).textContent='𝄞';el('text',{x:47,y:y+17,'font-size':14},s).textContent=document.getElementById('meter').value;for(let b=0;b<=4;b++)el('line',{x1:55+b*190,y1:y-3,x2:55+b*190,y2:y+43,stroke:'#333'},s)}
notes.forEach((n,i)=>{let y=65+n.system*205+40-(n.midi-76)*5,g=el('g',{style:'cursor:pointer'},s);if(n.rest){let sym={4:'𝄻',2:'𝄼',1:'𝄽',.5:'𝄾',.25:'𝄿'};el('text',{x:n.x,y:65+n.system*205+24,'font-size':25,'text-anchor':'middle'},g).textContent=sym[n.duration]||'𝄽'}else{el('ellipse',{cx:n.x,cy:y,rx:6.5,ry:4.3,transform:`rotate(-18 ${n.x} ${y})`,fill:n.duration>=2?'white':'#111',stroke:'#111'},g);if(n.duration<4)el('line',{x1:n.x+6,y1:y,x2:n.x+6,y2:y-34,stroke:'#111','stroke-width':1.5},g);if(n.duration<=.5)el('path',{d:`M ${n.x+6} ${y-34} q 13 7 1 17`,fill:'none',stroke:'#111'},g);if(n.duration<=.25)el('path',{d:`M ${n.x+6} ${y-27} q 13 7 1 17`,fill:'none',stroke:'#111'},g)}g.onclick=e=>{e.stopPropagation();if(tool==='erase'){notes.splice(i,1);draw()}}});
s.onclick=e=>{if(e.target.closest('g'))return;let p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(s.getScreenCTM().inverse()),sys=Math.max(0,Math.floor((q.y-65)/205)),midi=Math.max(48,Math.min(88,76+Math.round((65+sys*205+40-q.y)/5)));add(midi,q.x,sys)}}
function buildKeys(){let k=document.getElementById('keyboard');k.innerHTML='';document.getElementById('oct').textContent=octave;let start=(octave+1)*12;for(let i=0;i<24;i++){let m=start+i;if([0,2,4,5,7,9,11].includes(m%12)){let w=document.createElement('div');w.className='white';w.textContent=m%12===0?'C'+(Math.floor(m/12)-1):'';w.onclick=()=>{add(m,90,0);sound(m)};if([0,2,5,7,9].includes(m%12)){let b=document.createElement('div');b.className='black';b.onclick=e=>{e.stopPropagation();add(m+1,90,0);sound(m+1)};w.appendChild(b)}k.appendChild(w)}}}
function sound(m){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}catch(e){}}
function playAll(){stop();let a=[...notes].sort((x,y)=>x.measure-y.measure||x.x-y.x),i=0,t=Math.max(30,Math.min(240,+document.getElementById('tempo').value||100));function next(){if(i>=a.length)return;let n=a[i++];if(!n.rest)sound(n.midi+ +document.getElementById('transpose').value);timer=setTimeout(next,60000/t*n.duration)}next()}
function stop(){if(timer)clearTimeout(timer);timer=null}
function loadYT(){let u=document.getElementById('yt').value,id='';try{let x=new URL(u);id=x.searchParams.get('v')||(x.hostname.includes('youtu.be')?x.pathname.slice(1):x.pathname.split('/embed/')[1]?.split('/')[0])}catch(e){}if(id)document.getElementById('frame').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);else alert('Zadej platný odkaz na YouTube.')}
function saveScore(){localStorage.setItem('museTouchScore',JSON.stringify({notes,meter:document.getElementById('meter').value,tempo:document.getElementById('tempo').value}));alert('Uloženo v tomto prohlížeči.')}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({notes,meter:document.getElementById('meter').value,tempo:document.getElementById('tempo').value},null,2)],{type:'application/json'}));a.download='moje-skladba.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);notes=(d.notes||[]).map(n=>({...n,measure:n.measure??((n.system||0)*4+Math.max(0,Math.floor((n.x-55)/190)))}));if(d.meter)document.getElementById('meter').value=d.meter;if(d.tempo)document.getElementById('tempo').value=d.tempo;draw()}catch(x){alert('Soubor nelze načíst.')}};r.readAsText(f)}
function newScore(){if(confirm('Vytvořit novou skladbu?')){notes=[];draw()}}
draw();buildKeys();
</script></body></html>
